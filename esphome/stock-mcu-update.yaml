# EXPERIMENT: flash this repo's MCU firmware onto a *stock* Gledopto MS51
# through the stock firmware's own Tuya MCU upgrade (0x0A / 0x0B), i.e.
# without catching the chip with ICP at power-on.
#
# The light is driven with the stock datapoints (stock MCU UART: 9600) so the
# controller stays usable while you try. The stock MCU has no version DP, so
# the installed version shows as unknown and the update counts as available.
#
#  1. Flash this to the T1-U. Watch the log (VERBOSE for tuya + tuya_mcu_dfu).
#  2. Press Install on "MCU firmware". Look for "MCU accepted update" and the
#     packet size the stock MCU asked for.
#  3. Success = the MCU reboots into the new firmware, which talks 115200, so
#     this config can't see it: the product-information check times out and
#     the update reports failure (expected at 9600). Flash gl-c-301w.yaml; the
#     MCU should then report its version on DP 120.
#
# Only the stock updater's target area (probably APROM) changes: the stock
# LDROM, its size and CONFIG (locked, reset pin off) stay as they are. This
# repo's app expects an LDROM of at most 3 KB (its settings page is at
# 0x7300); see README section 7.
#
# If the stock updater rejects or mangles the image, the MCU may be left
# without a working app: recover with ICP (mcu/: pio run -e app -t provision).

substitutions:
  name: gl-c-301w
  friendly_name: Bathroom Mirror
  stock_mcu_baud: "9600"
  mcu_firmware: https://github.com/JesseMcL/GL-C-301W_ESPHome/releases/latest/download/manifest.json

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

external_components:
  # MCU firmware update: https://github.com/JesseMcL/esphome_tuya_mcu_dfu
  - source: github://JesseMcL/esphome_tuya_mcu_dfu@main
    components: [tuya_mcu_dfu]

bk72xx:
  board: t1-u

logger:
  baud_rate: 0
  level: VERBOSE
  logs:
    tuya: VERBOSE
    tuya_mcu_dfu: VERBOSE

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret fallback_ap_password

captive_portal:

uart:
  id: mcu_uart
  tx_pin: P11
  rx_pin: P10
  baud_rate: ${stock_mcu_baud}

tuya:
  id: mcu
  uart_id: mcu_uart

# Stock Gledopto datapoints (from the Tuya cloud schema of this device):
#   20 switch_led bool, 21 work_mode enum, 22 bright_value 10..1000,
#   23 temp_value 0..1000, 24 colour_data HSV hex string
light:
  - platform: tuya
    name: Light
    switch_datapoint: 20
    dimmer_datapoint: 22
    min_value: 10
    max_value: 1000
    color_temperature_datapoint: 23
    color_temperature_max_value: 1000
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K

update:
  - platform: tuya_mcu_dfu
    id: mcu_update
    name: MCU firmware
    tuya_id: mcu
    uart_id: mcu_uart
    source: ${mcu_firmware}
    chip_family: MS51FC0AE
    # no version_datapoint: the stock MCU has none
    # stock firmware may be slow to answer while it erases flash
    start_timeout: 15s
    packet_timeout: 10s
