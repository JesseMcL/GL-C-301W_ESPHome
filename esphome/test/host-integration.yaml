# HOST integration test (run.sh): the production packages on the `host`
# platform, UART on a pty to mcu/sim (real app protocol + bootloader core),
# MCU firmware bundled from the local mcu/dist build.

substitutions:
  friendly_name: GL-C-301W host test
  mcu_baud: "115200"
  mcu_firmware: ../../mcu/dist/manifest.json

packages:
  mcu: !include ../packages/mcu.yaml
  light: !include ../packages/light-cct.yaml

esphome:
  name: gl-c-301w-host-test
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - logger.log: "TEST: light on"
      - light.turn_on: {id: led_light, brightness: 100%, color_temperature: 2700 K, transition_length: 1s}
      - delay: 2s
      - logger.log: "TEST: starting MCU update"
      - update.perform: mcu_update
      - delay: 25s
      - logger.log: "TEST: light after update"
      - light.turn_on: {id: led_light, brightness: 50%, color_temperature: 6500 K, transition_length: 0s}

external_components:
  - source:
      type: local
      path: ../components
    components: [tuya_mcu]

host:

logger:
  level: DEBUG
  logs:
    tuya: INFO
    binary_sensor: INFO
    script: INFO

uart:
  id: mcu_uart
  port: /tmp/esptty
  baud_rate: ${mcu_baud}

