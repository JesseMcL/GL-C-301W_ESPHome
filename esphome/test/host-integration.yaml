# HOST integration test (run.sh): the production YAML on the `host` platform,
# UART on a pty to mcu/sim (real app protocol + bootloader core), MCU firmware
# bundled from the local mcu/dist build. Generated from bathroom-mirror-1.yaml.
#
# MCU datapoints (mcu/include/tuya_dp.h):
#   101..105 R,G,B,C,W duty   value 0..65535   rw
#   106      fade ms          value 0..10000   rw
#   107      power button     bool             ro
#   108      set button       bool             ro
#   109      status LED mode  enum 0 auto 1 manual
#   110..112 red/green/blue status LED  bool   rw
#   120      firmware version string           ro

substitutions:
  name: bathroom-mirror-1
  friendly_name: Bathroom Mirror
  # 115200 for this repo's MCU firmware. The stock Gledopto MCU firmware
  # probably talks 9600 - use that to try the update on a stock MCU.
  mcu_baud: "115200"
  # Release manifest the MCU firmware is bundled from at compile time.
  # Before the first GitHub release exists, point this at a local build:
  #   ../mcu/dist/manifest.json
  mcu_firmware: ../../mcu/dist/manifest.json

esphome:
  name: gl-c-301w-host-test
  friendly_name: ${friendly_name}
  project:
    name: jessemcl.gl-c-301w
    version: "1.0"
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - light.turn_on: {id: mirror, brightness: 100%, color_temperature: 2700 K, transition_length: 1s}
      - delay: 2s
      - logger.log: "TEST: starting MCU update"
      - lambda: id(mcu_update).perform(false);
      - delay: 25s
      - logger.log: "TEST: light after update"
      - light.turn_on: {id: mirror, brightness: 50%, color_temperature: 6500 K, transition_length: 0s}

external_components:
  - source:
      type: local
      path: ../components
    components: [tuya_mcu]
  # once the repo is on GitHub, this works from anywhere:
  # - source: github://JesseMcL/GL-C-301W_ESPHome/esphome/components@main
  #   components: [tuya_mcu]

host:

logger:
  level: DEBUG
  logs:
    tuya: INFO
    light: INFO
    binary_sensor: INFO

uart:
  id: mcu_uart
  port: /tmp/esptty
  baud_rate: ${mcu_baud}

tuya:
  id: mcu
  uart_id: mcu_uart

# ---- LED driver channels ----------------------------------------------------
output:
  - { platform: tuya_mcu, id: out_r, datapoint: 101 }
  - { platform: tuya_mcu, id: out_g, datapoint: 102 }
  - { platform: tuya_mcu, id: out_b, datapoint: 103 }
  - { platform: tuya_mcu, id: out_c, datapoint: 104 }
  - { platform: tuya_mcu, id: out_w, datapoint: 105 }

light:
  # CCT mirror strip on the C and W channels
  - platform: cwww
    id: mirror
    name: Light
    cold_white: out_c
    warm_white: out_w
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
    constant_brightness: true
    default_transition_length: 400ms
    gamma_correct: 2.8
    restore_mode: RESTORE_DEFAULT_OFF

  # RGB+CCT strip: use this instead
  # - platform: rgbww
  #   id: mirror
  #   name: Light
  #   red: out_r
  #   green: out_g
  #   blue: out_b
  #   cold_white: out_c
  #   warm_white: out_w
  #   cold_white_color_temperature: 6500 K
  #   warm_white_color_temperature: 2700 K
  #   color_interlock: true
  #   constant_brightness: true
  #   default_transition_length: 400ms
  #   restore_mode: RESTORE_DEFAULT_OFF

number:
  - platform: tuya
    name: Channel smoothing
    number_datapoint: 106
    min_value: 0
    max_value: 1000
    step: 10
    unit_of_measurement: ms
    mode: box
    entity_category: config

# ---- Buttons on the controller ---------------------------------------------
binary_sensor:
  - platform: tuya
    id: btn_power
    name: Power button
    sensor_datapoint: 107
    on_multi_click:
      - timing: [ON for at most 600ms, OFF for at least 50ms]
        then:
          - light.toggle: mirror
      - timing: [ON for at least 800ms]
        then:
          - lambda: |-
              // long press: switch between full and night level
              auto *l = id(mirror);
              auto call = l->turn_on();
              call.set_brightness(l->remote_values.get_brightness() > 0.5f ? 0.15f : 1.0f);
              call.perform();

  - platform: tuya
    id: btn_set
    name: Set button
    sensor_datapoint: 108
    on_click:
      max_length: 600ms
      then:
        - lambda: |-
            // cycle warm / neutral / cool
            static const float mireds[] = {370.0f, 250.0f, 166.0f};
            static uint8_t idx = 0;
            idx = (idx + 1) % 3;
            auto call = id(mirror).turn_on();
            call.set_color_temperature(mireds[idx]);
            call.perform();

# ---- RGB status LED on the controller ---------------------------------------
select:
  - platform: tuya
    name: Status LED mode
    enum_datapoint: 109
    options:
      0: Auto
      1: Manual
    entity_category: config

switch:
  - { platform: tuya, name: Status LED red,   switch_datapoint: 110, entity_category: config }
  - { platform: tuya, name: Status LED green, switch_datapoint: 111, entity_category: config }
  - { platform: tuya, name: Status LED blue,  switch_datapoint: 112, entity_category: config }

# ---- MCU firmware -------------------------------------------------------------
text_sensor:
  - platform: tuya
    name: MCU firmware version
    sensor_datapoint: 120
    entity_category: diagnostic
  - platform: version
    name: ESPHome version

update:
  - platform: tuya_mcu
    id: mcu_update
    name: MCU firmware
    tuya_id: mcu
    uart_id: mcu_uart
    source: ${mcu_firmware}


button:
  - platform: restart
    name: Restart
