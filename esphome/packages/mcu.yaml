# GL-C-301W: everything that talks to the MS51 MCU running this repo's
# firmware (mcu/). Included by ../gl-c-301w.yaml and the host test; the
# including file provides `uart: id: mcu_uart` and one light package
# (light-*.yaml) that defines `id: led_light`.
#
# MCU datapoints (mcu/include/tuya_dp.h):
#   101..105 R,G,B,C,W level   value 0..65535    rw
#   106      fade ms           value 0..10000    rw  (saved in the MCU)
#   107      power button      bool              ro
#   108      set button        bool              ro
#   109      status LED mode   enum 0 auto 1 manual 2 quiet   rw (saved)
#   110..112 status LED r/g/b  bool              rw  (manual mode)
#   113      strip type        enum 0 RGBCCT 1 RGBW 2 RGB 3 CCT 4 dimmer (saved)
#   114      PWM frequency     enum 0 600 1 800 2 1000 3 2000 4 4000 5 8000 Hz (saved)
#   115      power-on memory   bool              rw  (saved)
#   116      reset settings    bool, write 1     (reads 0)
#   120      firmware version  string            ro
#
# The Set button is handled by the MCU as in the Gledopto manual:
#   1 click  next strip type        2 clicks  next PWM frequency
#   3 clicks power-on memory        hold 3 s  reset settings
# The power button is handled here while ESPHome is up (the MCU takes over
# when the link is lost): click = on/off, hold = dim, alternating up/down.

substitutions:
  # Raise to the level where the strip just starts to glow (dead zone of the
  # MOSFET gate drive), e.g. 0.004. 0 = off.
  min_power: "0"

tuya:
  id: mcu
  uart_id: mcu_uart

# ---- LED driver channels ----------------------------------------------------
output:
  - { platform: tuya_mcu, id: out_r, datapoint: 101, min_power: "${min_power}", zero_means_zero: true }
  - { platform: tuya_mcu, id: out_g, datapoint: 102, min_power: "${min_power}", zero_means_zero: true }
  - { platform: tuya_mcu, id: out_b, datapoint: 103, min_power: "${min_power}", zero_means_zero: true }
  - { platform: tuya_mcu, id: out_c, datapoint: 104, min_power: "${min_power}", zero_means_zero: true }
  - { platform: tuya_mcu, id: out_w, datapoint: 105, min_power: "${min_power}", zero_means_zero: true }

number:
  - platform: tuya
    name: Channel smoothing
    number_datapoint: 106
    min_value: 0
    max_value: 1000
    step: 10
    unit_of_measurement: ms
    mode: box
    entity_category: config

# ---- Buttons on the controller ---------------------------------------------
binary_sensor:
  - platform: tuya
    id: btn_power
    name: Power button
    sensor_datapoint: 107
    on_multi_click:
      - timing: [ON for at most 600ms, OFF for at least 50ms]
        then:
          - light.toggle: led_light
      - timing: [ON for at least 700ms]
        then:
          - script.execute: dim_while_held

  # Handled by the MCU (see above); exposed for automations.
  - platform: tuya
    id: btn_set
    name: Set button
    sensor_datapoint: 108

script:
  # Long press on the power button: ramp the brightness while it is held.
  # Each long press reverses the direction, like the stock firmware; from
  # off it always goes up.
  - id: dim_while_held
    mode: restart
    then:
      - if:
          condition:
            light.is_off: led_light
          then:
            - switch.turn_on: dim_up
          else:
            - switch.toggle: dim_up
      - while:
          condition:
            binary_sensor.is_on: btn_power
          then:
            - if:
                condition:
                  switch.is_on: dim_up
                then:
                  - light.dim_relative:
                      id: led_light
                      relative_brightness: 3%
                      transition_length: 50ms
                      brightness_limits:
                        min_brightness: 1%
                else:
                  - light.dim_relative:
                      id: led_light
                      relative_brightness: -3%
                      transition_length: 50ms
                      brightness_limits:
                        min_brightness: 1%
            - delay: 50ms

switch:
  - platform: template
    id: dim_up
    internal: true
    optimistic: true

  # On for the first 30 s after boot (switched on during setup by its
  # restore mode); see "Power-on memory".
  - platform: template
    id: boot_window
    internal: true
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - delay: 30s
      - switch.turn_off: boot_window

  # Power-on memory (Set x3). On: the light comes back as it was before the
  # power cut (the light's RESTORE_DEFAULT_OFF). Off (stock default): the
  # light always comes on at power-up. The MCU reports this DP during the
  # start-up handshake, which fires on_turn_off once.
  - platform: tuya
    id: power_memory
    name: Power-on memory
    switch_datapoint: 115
    entity_category: config
    on_turn_off:
      - if:
          condition:
            switch.is_on: boot_window
          then:
            - light.turn_on: led_light

  - platform: tuya
    id: mcu_reset_settings
    internal: true
    switch_datapoint: 116

  # Status LED, manual mode
  - { platform: tuya, name: Status LED red,   switch_datapoint: 110, entity_category: config }
  - { platform: tuya, name: Status LED green, switch_datapoint: 111, entity_category: config }
  - { platform: tuya, name: Status LED blue,  switch_datapoint: 112, entity_category: config }

button:
  # Same as holding Set for 3 s: RGBCCT, 1000 Hz, memory off, LED auto
  - platform: template
    name: Reset controller settings
    entity_category: config
    on_press:
      - switch.turn_on: mcu_reset_settings

select:
  - platform: tuya
    name: Strip type
    enum_datapoint: 113
    options:
      0: RGBCCT
      1: RGBW
      2: RGB
      3: CCT
      4: Dimmer
    entity_category: config

  - platform: tuya
    name: PWM frequency
    enum_datapoint: 114
    options:
      0: 600 Hz
      1: 800 Hz
      2: 1000 Hz
      3: 2000 Hz
      4: 4000 Hz
      5: 8000 Hz
    entity_category: config

  - platform: tuya
    name: Status LED mode
    enum_datapoint: 109
    options:
      0: Auto
      1: Manual
      2: Quiet
    entity_category: config

# ---- MCU firmware -------------------------------------------------------------
text_sensor:
  - platform: tuya
    name: MCU firmware version
    sensor_datapoint: 120
    entity_category: diagnostic

update:
  - platform: tuya_mcu
    id: mcu_update
    name: MCU firmware
    tuya_id: mcu
    uart_id: mcu_uart
    source: ${mcu_firmware}
