# Light entity for a RGBCCT strip. Use with the "Strip type" setting = RGBCCT
# (Set button / DP 113), which routes the channels in the MCU.
# Unnamed: the entity takes the device's friendly name. Restore mode is the
# default RESTORE_DEFAULT_OFF, which "Power-on memory" relies on.
light:
  - platform: rgbww
    id: led_light
    red: out_r
    green: out_g
    blue: out_b
    cold_white: out_c
    warm_white: out_w
    # Needed for colour temperature control (otherwise the range is 0-0);
    # set to the strip's actual whites.
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
