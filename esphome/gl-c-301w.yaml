# Gledopto GL-C-301W - T1-U-HL (BK7238) running ESPHome, talking TuyaMCU to
# the MS51FC0AE running this repo's firmware (mcu/).
#
# The MCU side (datapoints, buttons, settings, MCU firmware update) is in
# packages/mcu.yaml; the light entity in packages/light-<strip type>.yaml.

substitutions:
  name: gl-c-301w
  friendly_name: Gledopto GL-C-301W
  # 115200 for this repo's MCU firmware. The stock Gledopto MCU firmware
  # probably talks 9600 - use that to try the update on a stock MCU.
  mcu_baud: "115200"
  # Release manifest the MCU firmware is bundled from at compile time.
  # Before the first GitHub release exists, point this at a local build:
  #   ../mcu/dist/manifest.json
  mcu_firmware: https://github.com/JesseMcL/GL-C-301W_ESPHome/releases/latest/download/manifest.json
  # Level where the strip just starts to glow, see packages/mcu.yaml:
  # min_power: "0.004"

packages:
  mcu: !include packages/mcu.yaml
  # Pick the one matching the strip (and set "Strip type" to the same):
  light: !include packages/light-cct.yaml
  # light: !include packages/light-rgbcct.yaml
  # light: !include packages/light-rgbw.yaml
  # light: !include packages/light-rgb.yaml
  # light: !include packages/light-dimmer.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

external_components:
  - source:
      type: local
      path: components
    components: [tuya_mcu]
  # once the repo is on GitHub, this works from anywhere:
  # - source: github://JesseMcL/GL-C-301W_ESPHome/esphome/components@main
  #   components: [tuya_mcu]

bk72xx:
  board: t1-u

logger:
  baud_rate: 0          # UART1 (P10/P11) belongs to the MCU
  logs:
    tuya: INFO          # channel writes would otherwise flood DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}      # reuses the API encryption key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret fallback_ap_password

captive_portal:

uart:
  id: mcu_uart
  tx_pin: P11           # T1 pin 15 -> MCU pin 3 (UART0 RXD)
  rx_pin: P10           # T1 pin 16 <- MCU pin 2 (UART0 TXD)
  baud_rate: ${mcu_baud}

text_sensor:
  - platform: version
    name: ESPHome version

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s

button:
  - platform: restart
    name: Restart
