# Gledopto GL-C-301W - T1-U-HL (BK7238) running ESPHome, talking TuyaMCU to
# the MS51FC0AE running this repo's firmware (mcu/).
#
# MCU datapoints (mcu/include/tuya_dp.h):
#   101..105 R,G,B,C,W duty   value 0..65535   rw
#   106      fade ms          value 0..10000   rw
#   107      power button     bool             ro
#   108      set button       bool             ro
#   109      status LED mode  enum 0 auto 1 manual
#   110..112 red/green/blue status LED  bool   rw
#   120      firmware version string           ro

substitutions:
  name: GL-C-301W
  friendly_name: Gledopto GL-C-301W
  # 115200 for this repo's MCU firmware. The stock Gledopto MCU firmware
  # probably talks 9600 - use that to try the update on a stock MCU.
  mcu_baud: "115200"
  # Release manifest the MCU firmware is bundled from at compile time.
  # Before the first GitHub release exists, point this at a local build:
  #   ../mcu/dist/manifest.json
  mcu_firmware: https://github.com/JesseMcL/GL-C-301W_ESPHome/releases/latest/download/manifest.json

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: gl-c-301w
    version: "1.0"

external_components:
  - source:
      type: local
      path: components
    components: [tuya_mcu]
  # once the repo is on GitHub, this works from anywhere:
  # - source: github://JesseMcL/GL-C-301W_ESPHome/esphome/components@main
  #   components: [tuya_mcu]

bk72xx:
  board: t1-u

logger:
  baud_rate: 0          # UART1 (P10/P11) belongs to the MCU
  logs:
    tuya: INFO          # channel writes would otherwise flood DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}      # reuses the API encryption key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret fallback_ap_password

captive_portal:

uart:
  id: mcu_uart
  tx_pin: P11           # T1 pin 15 -> MCU pin 3 (UART0 RXD)
  rx_pin: P10           # T1 pin 16 <- MCU pin 2 (UART0 TXD)
  baud_rate: ${mcu_baud}

tuya:
  id: mcu
  uart_id: mcu_uart

# ---- LED driver channels ----------------------------------------------------
output:
  - { platform: tuya_mcu, id: out_r, datapoint: 101 }
  - { platform: tuya_mcu, id: out_g, datapoint: 102 }
  - { platform: tuya_mcu, id: out_b, datapoint: 103 }
  - { platform: tuya_mcu, id: out_c, datapoint: 104 }
  - { platform: tuya_mcu, id: out_w, datapoint: 105 }

light:
  # CCT light strip on the C and W channels
  - platform: cwww
    id: cw_light
    cold_white: out_c
    warm_white: out_w

  # RGB+CCT strip: use this instead
  # - platform: rgbww
  #   id: rgbcw_light
  #   red: out_r
  #   green: out_g
  #   blue: out_b
  #   cold_white: out_c
  #   warm_white: out_w

number:
  - platform: tuya
    name: Channel smoothing
    number_datapoint: 106
    min_value: 0
    max_value: 1000
    step: 10
    unit_of_measurement: ms
    mode: box
    entity_category: config

# ---- Buttons on the controller ---------------------------------------------
binary_sensor:
  - platform: tuya
    id: btn_power
    name: Power button
    sensor_datapoint: 107
    on_multi_click:
      - timing: [ON for at most 600ms, OFF for at least 50ms]
        then:
          - light.toggle: cw_light
      - timing: [ON for at least 800ms]
        then:
          - lambda: |-
              // long press: switch between full and night level
              auto *l = id(cw_light);
              auto call = l->turn_on();
              call.set_brightness(l->remote_values.get_brightness() > 0.5f ? 0.15f : 1.0f);
              call.perform();

  - platform: tuya
    id: btn_set
    name: Set button
    sensor_datapoint: 108
    on_click:
      max_length: 600ms
      then:
        - lambda: |-
            // cycle warm / neutral / cool
            static const float mireds[] = {370.0f, 250.0f, 166.0f};
            static uint8_t idx = 0;
            idx = (idx + 1) % 3;
            auto call = id(cw_light).turn_on();
            call.set_color_temperature(mireds[idx]);
            call.perform();

# ---- RGB status LED on the controller ---------------------------------------
select:
  - platform: tuya
    name: Status LED mode
    enum_datapoint: 109
    options:
      0: Auto
      1: Manual
    entity_category: config

switch:
  - { platform: tuya, name: Status LED red,   switch_datapoint: 110, entity_category: config }
  - { platform: tuya, name: Status LED green, switch_datapoint: 111, entity_category: config }
  - { platform: tuya, name: Status LED blue,  switch_datapoint: 112, entity_category: config }

# ---- MCU firmware -------------------------------------------------------------
text_sensor:
  - platform: tuya
    name: MCU firmware version
    sensor_datapoint: 120
    entity_category: diagnostic
  - platform: version
    name: ESPHome version

update:
  - platform: tuya_mcu
    id: mcu_update
    name: MCU firmware
    tuya_id: mcu
    uart_id: mcu_uart
    source: ${mcu_firmware}

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s

button:
  - platform: restart
    name: Restart
