; GL-C-301W - Nuvoton MS51FC0AE firmware
;
;   pio run                      build app (APROM) + boot (LDROM) -> dist/
;   pio test -e native           protocol + bootloader unit tests on the host
;   pio run -e app -t provision  first-time ICP via the Pi (mass erase + all)
;   pio run -e app -t upload     APROM only over ICP
;   pio run -e boot -t upload    LDROM + dev CONFIG over ICP
;
; Day-to-day updates go over the air: ESPHome -> T1-U -> UART -> bootloader.

[platformio]
default_envs = app, boot

[mcu]
platform = intel_mcs51 @ ~2.2.0
board = MS51FC0AE
board_build.f_cpu = 24000000L
; keep XRAM 0x7F0.. free for the app -> bootloader hand-off (layout.h)
board_build.size_xram = 2032
custom_ldrom_size = 3072
build_flags =
    -D__SDCC__
    -DLDROM_SIZE=3072
extra_scripts =
    pre:scripts/bsp.py
    pre:scripts/version.py
    post:scripts/fwimage.py
    post:scripts/icp.py
upload_protocol = custom

[env:app]
extends = mcu
build_src_filter = +<app/>
; APROM (29 KB) - record + settings pages (2 x 128) - footer (32)
board_build.size_code = 29408

[env:boot]
extends = mcu
build_src_filter = +<boot/>
board_build.size_code = 3072
build_flags =
    ${mcu.build_flags}
    --fomit-frame-pointer

; Host build of the hardware-independent code for unit tests
[env:native]
platform = native
build_src_filter = +<app/proto.c> +<app/logic.c> +<boot/boot_core.c>
build_flags = -Iinclude -Isrc/boot -Wall -Wextra
test_build_src = yes
test_framework = unity
